name: 🐞 Bug Report
description: File a bug report to help us fix an issue
title: "bug: <short description>"
labels: ["type: bug 🐛", "status: needs triage"]
assignees:
  - bhdicaire
body:
  - type: checkboxes
    attributes:
      label: Pre-flight Check
      description: Please verify that you have searched existing issues.
      options:
        - label: I have searched existing issues to ensure this bug is not a duplicate.
          required: true

  - type: checkboxes
    attributes:
      label: Is this a regression?
      description: Did this feature work in a previous version?
      options:
        - label: Yes, this used to work previously.
          required: false

  - type: textarea
    attributes:
      label: Current Behavior
      description: A clear description of what is happening.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment & Context
      description: OS, runtime, node/python/browser versions, or relevant setup.
      value: |
        - OS:
        - Version/Commit:
        - Environment Details:
      render: markdown
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context / Screenshots
      description: Add logs, screenshots, or code snippets here.
    validations:
      required: false
