name: 🚀 Feature Request
description: Propose a new feature, improvement, or architectural change
title: "feat: <short description>"
labels: ["type: feature ✨", "status: needs triage"]
assignees:
  - bhdicaire
body:
  - type: checkboxes
    attributes:
      label: Pre-flight Check
      options:
        - label: I have searched existing issues and feature requests.
          required: true

  - type: textarea
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? (e.g., "I'm frustrated when...")
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've evaluated.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Add mockups, architectural notes, or links here.
    validations:
      required: false
